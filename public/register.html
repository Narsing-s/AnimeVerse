<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AnimeVerse — Create account</title><link rel="stylesheet" href="/styles.css"></head><body><main style="min-height:100vh;display:grid;place-items:center;padding:24px"><form id="form" class="modal-panel" style="width:min(460px,100%)"><span class="kicker">JOIN ANIMEVERSE</span><h1>Create your account</h1><input id="name" class="search-input" placeholder="Name"><input id="email" class="search-input" type="email" placeholder="Email" required><input id="password" class="search-input" type="password" placeholder="Password (8+ characters)" minlength="8" required><button class="primary" type="submit">Create account</button><p id="msg" class="muted"></p><p>Already registered? <a href="/login.html">Sign in</a></p></form></main><script>form.onsubmit=async e=>{e.preventDefault();msg.textContent="Creating account…";const r=await fetch("/api/auth/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:name.value,email:email.value,password:password.value})});const d=await r.json();if(r.ok)location.href="/";else msg.textContent=d.error||"Registration failed"};</script></body></html>
