<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AnimeVerse — Sign in</title><link rel="stylesheet" href="/styles.css"></head><body><main style="min-height:100vh;display:grid;place-items:center;padding:24px"><form id="form" class="modal-panel" style="width:min(460px,100%)"><span class="kicker">ANIMEVERSE ACCOUNT</span><h1>Welcome back</h1><input id="email" class="search-input" type="email" placeholder="Email" required><input id="password" class="search-input" type="password" placeholder="Password" minlength="8" required><button class="primary" type="submit">Sign in</button><p id="msg" class="muted"></p><p>New here? <a href="/register.html">Create an account</a></p></form></main><script>form.onsubmit=async e=>{e.preventDefault();msg.textContent="Signing in…";const r=await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:email.value,password:password.value})});const d=await r.json();if(r.ok)location.href="/admin/";else msg.textContent=d.error||"Sign in failed"};</script></body></html>
