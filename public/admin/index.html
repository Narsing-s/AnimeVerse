<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AnimeVerse Admin</title><link rel="stylesheet" href="/styles.css"><style>body{padding:30px}.admin-wrap{max-width:1180px;margin:auto}.admin-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}.admin-grid{display:grid;grid-template-columns:1fr 1.5fr;gap:20px}.panel{background:#12141d;border:1px solid var(--line);border-radius:20px;padding:22px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.tabs button{padding:9px 13px;border:1px solid var(--line);border-radius:999px;background:none;color:#aaa;cursor:pointer}.tabs button.active{background:#fff;color:#111}.form{display:grid;gap:10px}.form input,.form textarea,.form select{width:100%;padding:12px;background:#0b0c11;border:1px solid var(--line);color:#fff;border-radius:10px}.form textarea{min-height:90px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.records{display:grid;gap:10px}.record{display:flex;justify-content:space-between;gap:12px;padding:13px;border:1px solid var(--line);border-radius:12px}.record small{color:#aaa}.record button{border:1px solid var(--line);background:none;color:#fff;border-radius:8px;padding:7px;cursor:pointer}.danger{color:#ff8f8f!important}.status{color:#a9f99d}.back{color:#aaa;text-decoration:none}</style></head><body><div class="admin-wrap"><div class="admin-top"><div><a class="back" href="/">← AnimeVerse</a><h1>Content Studio</h1><p style="color:#aaa">Manage the worlds your visitors discover.</p></div><span class="status">● Admin surface</span></div><div class="admin-grid"><section class="panel"><div class="tabs"><button class="active" data-kind="anime">Anime</button><button data-kind="character">Characters</button><button data-kind="trailer">Trailers</button><button data-kind="gallery">Gallery</button></div><form id="editor" class="form"><input type="hidden" id="id"><input id="title" placeholder="Title" required><input id="subtitle" placeholder="Subtitle"><textarea id="description" placeholder="Description"></textarea><div class="row"><input id="year" type="number" placeholder="Year"><input id="genres" placeholder="Genres"></div><input id="poster" placeholder="Poster image URL"><input id="backdrop" placeholder="Backdrop image URL"><input id="role" placeholder="Character role (character only)"><input id="image" placeholder="Image URL (character/gallery)"><input id="youtube_url" placeholder="YouTube URL (trailer only)"><select id="anime_kind"><option>Movie</option><option>Series</option><option>Ghibli</option></select><label><input id="featured" type="checkbox"> Featured</label><label><input id="published" type="checkbox" checked> Published</label><button class="primary" type="submit">Save content</button><button class="ghost" type="button" id="reset">Clear</button></form></section><section class="panel"><h2 id="listTitle">Anime</h2><div id="records" class="records">Loading…</div></section></div></div><script src="/admin/admin.js"></script></body></html>
